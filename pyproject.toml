[project]
name = "floodshift"
version = "0.1.0"
description = "Projection-mapped disaster response simulation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core server
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",

    # Computer Vision
    "opencv-contrib-python>=4.9.0",
    "numpy>=1.26.0",
    "pillow>=10.0.0",

    # Routing/Graph
    "networkx>=3.2.0",

    # HTTP client
    "httpx>=0.26.0",
]

[project.optional-dependencies]
geo = [
    # Geospatial (P4 may need these)
    "geopandas>=0.14.0",
    "shapely>=2.0.0",
    "osmnx>=1.7.0",
    "pyproj>=3.6.0",
    "rasterio>=1.3.0",
]
ai = [
    # Perceptron and Gemini
    "perceptron>=0.4.0",
    "google-genai>=0.4.0",
]
tiger = [
    # Tiger Data / TimescaleDB
    "psycopg[binary]>=3.1.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
